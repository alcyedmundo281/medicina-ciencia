# Mapa editorial del libro Medicina y Ciencia.
#
#   python -m libro mapa   → regenera mapa-maestro-libro.md
#   python -m libro check  → valida coherencia mapa ↔ posts ↔ casos ↔ JSON
#   python -m libro json   → genera build/libro.json
#   python -m libro qmd    → genera build/quarto/ (HTML, PDF LuaLaTeX y EPUB)
#   python -m libro build  → compila PDF (170 × 244 mm) y verifica con pdfinfo
#   python -m libro epub   → compila EPUB 3 y verifica su estructura
#   python -m libro html   → compila libro web HTML

