name: publicación

# Única compilación del libro por cambio: HTML, EPUB 3 (validado con EPUBCheck 5.1.0),
# PDF LuaLaTeX (170 x 244 mm, verificado con pdfinfo) y fuente LuaLaTeX (.zip), desde el
# mismo proyecto Quarto (JSON -> QMD -> Quarto). Motor replicado de
# alcyedmundo281/biosemiotics.
#
# - compilar: corre en PR, en push a main, en releases y a mano; solo lee el repositorio.
# - pages:    despliega build/html (más EPUB y JSON) en GitHub Pages tras un push a main.
# - release:  adjunta los artefactos al release; es el único job con contents: write.
#
# Las pruebas y la validación rápida viven en ci.yml.

on:
  push:
    branches: [main]
    paths:
      - 'mapa.yaml'
      - 'posts/**'
      - 'casos/**'
      - 'unidades/**'
      - 'paratextos/**'
      - 'assets/**'
      - 'tools/**'
      - 'CITATION.cff'
      - 'requirements.txt'
      - '.github/workflows/epub-pdf.yml'
  pull_request:
    paths:
      - 'mapa.yaml'
      - 'posts/**'
      - 'casos/**'
      - 'unidades/**'
      - 'paratextos/**'
      - 'assets/**'
      - 'tools/**'
      - 'CITATION.cff'
      - 'requirements.txt'
      - '.github/workflows/epub-pdf.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publicacion-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compilar:
    name: Compilar HTML, EPUB, PDF LuaLaTeX y ZIP fuente
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: tools
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependencias de Python
        run: pip install -r requirements.txt

      - name: Instalar dependencias del sistema (LuaLaTeX, poppler, rsvg-convert, Java)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pandoc fonts-freefont-ttf default-jre-headless librsvg2-bin \
            poppler-utils texlive-latex-recommended texlive-latex-extra \
            texlive-bibtex-extra texlive-lang-spanish texlive-luatex
          echo "rsvg-convert: $(rsvg-convert --version)"
          echo "lualatex: $(lualatex --version | head -1)"
          echo "pdfinfo: $(pdfinfo -v 2>&1 | head -1)"

      - name: Instalar Libertinus 7.051
        run: |
          VER=7.051
          curl -fsSL -o /tmp/libertinus.zip \
            "https://github.com/alerque/libertinus/releases/download/v${VER}/Libertinus-${VER}.zip"
          unzip -q /tmp/libertinus.zip -d /tmp/libertinus
          mkdir -p ~/.local/share/fonts
          find /tmp/libertinus -name 'Libertinus*.otf' -exec cp {} ~/.local/share/fonts/ \;
          fc-cache -f
          for familia in "Libertinus Serif" "Libertinus Sans" "Libertinus Serif Display"; do
            fc-list | grep -q "$familia" || { echo "::error::Falta la fuente $familia"; exit 1; }
          done

      - name: Instalar Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Instalar EPUBCheck 5.1.0
        run: |
          VER=5.1.0
          curl -fsSL -o /tmp/epubcheck.zip \
            "https://github.com/w3c/epubcheck/releases/download/v${VER}/epubcheck-${VER}.zip"
          unzip -q /tmp/epubcheck.zip -d /opt
          echo "EPUBCHECK_JAR=/opt/epubcheck-${VER}/epubcheck.jar" >> "$GITHUB_ENV"

      - name: Compilar y verificar las tres ediciones
        run: |
          python -m libro html
          python -m libro epub
          python -m libro pdf
          python -m libro latex-zip
          python -m libro check

      - name: Validar EPUB con EPUBCheck
        run: java -jar "$EPUBCHECK_JAR" --failonwarnings build/libro-medicina-y-ciencia.epub

      - name: Publicar artefactos descargables
        uses: actions/upload-artifact@v4
        with:
          name: medicina-ciencia-epub-pdf-latex
          path: |
            build/libro.json
            build/libro-medicina-y-ciencia.epub
            build/libro-medicina-y-ciencia.pdf
            build/quarto/libro-medicina-y-ciencia.tex
            build/medicina-ciencia-latex.zip
          retention-days: 90

      - name: Preparar el sitio de GitHub Pages
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        run: |
          cp build/libro-medicina-y-ciencia.epub build/html/
          cp build/libro.json build/html/

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        with:
          path: build/html/

  pages:
    needs: compilar
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: despliegue
        uses: actions/deploy-pages@v4

  release:
    needs: compilar
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: medicina-ciencia-epub-pdf-latex
          path: artefactos
      - name: Adjuntar artefactos al release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${{ github.event.release.tag_name }}"
          --repo "${{ github.repository }}" --clobber
          artefactos/libro.json
          artefactos/libro-medicina-y-ciencia.epub
          artefactos/libro-medicina-y-ciencia.pdf
          artefactos/quarto/libro-medicina-y-ciencia.tex
          artefactos/medicina-ciencia-latex.zip
