name: contrato

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Validar fuentes, metadatos y pruebas
        run: |
          python -m libro check
          cffconvert --validate
          python -m pytest
      - name: Generar JSON, proyecto Quarto y EPUB
        run: |
          python -m libro qmd
          python -m libro epub
          python -m libro check
      - uses: actions/upload-artifact@v4
        with:
          name: libro-artefactos
          path: |
            build/libro.json
            build/libro-medicina-y-ciencia.epub
            build/quarto/
          retention-days: 30
