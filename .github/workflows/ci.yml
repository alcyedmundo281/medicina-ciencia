name: contrato

# Validación rápida en cada push y PR: fuentes, metadatos, casos compilados y pruebas.
# No compila el libro: de eso se encarga una sola vez epub-pdf.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: tools
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # el registro de uso de IA se comprueba contra el historial
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validar fuentes, metadatos y pruebas
        run: |
          python -m libro check
          cffconvert --validate
          python -m pytest
